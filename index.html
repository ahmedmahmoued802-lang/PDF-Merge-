<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>PDF Merge</title>
                <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
                    <style>
                            body { font-family: sans-serif; background-color: #1a1a1a; display: flex; justify-content: center; padding: 50px; color: #eee; }
                                    .container { background: #2d2d2d; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; max-width: 500px; text-align: center; }
                                            h2 { color: #fff; margin-bottom: 5px; }
                                                    .developer-credit { font-size: 14px; color: #aaa; margin-bottom: 20px; font-style: italic; }
                                                            input[type="file"] { margin: 20px 0; padding: 10px; border: 2px dashed #007bff; border-radius: 8px; width: 90%; cursor: pointer; background-color: #333; color: #eee; }
                                                                    .filename-input-container { margin-bottom: 20px; text-align: right; width: 90%; margin-right: auto; margin-left: auto; }
                                                                            .filename-input-container label { display: block; margin-bottom: 5px; font-size: 14px; color: #ccc; }
                                                                                    input[type="text"] { width: 100%; padding: 10px; border: 1px solid #444; border-radius: 6px; background-color: #333; color: #fff; box-sizing: border-box; }
                                                                                            button { background-color: #28a745; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-size: 16px; transition: 0.3s; width: 90%; }
                                                                                                    button:hover { background-color: #218838; }
                                                                                                            button:disabled { background-color: #555; cursor: not-allowed; color: #999; }
                                                                                                                    #status { margin-top: 15px; font-size: 14px; color: #aaa; }
                                                                                                                            .file-list { text-align: right; margin: 15px 0; font-size: 13px; color: #bbb; width: 90%; margin-right: auto; margin-left: auto;}
                                                                                                                                </style>
                                                                                                                                </head>
                                                                                                                                <body>

                                                                                                                                <div class="container">
                                                                                                                                    <h2>PDF Merge</h2>
                                                                                                                                        <div class="developer-credit">By: Ahmed Mahmoud Fathy</div>
                                                                                                                                            
                                                                                                                                                <p>اختر ملفين أو أكثر لدمجهم في ملف واحد</p>
                                                                                                                                                    
                                                                                                                                                        <input type="file" id="fileInput" accept="application/pdf" multiple>
                                                                                                                                                            
                                                                                                                                                                <div id="fileList" class="file-list"></div>

                                                                                                                                                                    <div class="filename-input-container">
                                                                                                                                                                            <label for="fileNameInput">اسم الملف المدمج (اختياري):</label>
                                                                                                                                                                                    <input type="text" id="fileNameInput" placeholder="merged_document" dir="ltr">
                                                                                                                                                                                        </div>
                                                                                                                                                                                            
                                                                                                                                                                                                <button id="mergeBtn" disabled>دمج وحفظ الملف</button>
                                                                                                                                                                                                    
                                                                                                                                                                                                        <div id="status"></div>
                                                                                                                                                                                                        </div>

                                                                                                                                                                                                        <script>
                                                                                                                                                                                                            const fileInput = document.getElementById('fileInput');
                                                                                                                                                                                                                const mergeBtn = document.getElementById('mergeBtn');
                                                                                                                                                                                                                    const status = document.getElementById('status');
                                                                                                                                                                                                                        const fileList = document.getElementById('fileList');
                                                                                                                                                                                                                            const fileNameInput = document.getElementById('fileNameInput');

                                                                                                                                                                                                                                fileInput.addEventListener('change', () => {
                                                                                                                                                                                                                                        const files = fileInput.files;
                                                                                                                                                                                                                                                if (files.length >= 2) {
                                                                                                                                                                                                                                                            mergeBtn.disabled = false;
                                                                                                                                                                                                                                                                        fileList.innerHTML = "<b>الملفات المختارة:</b><br>";
                                                                                                                                                                                                                                                                                    for(let f of files) fileList.innerHTML += `- ${f.name}<br>`;
                                                                                                                                                                                                                                                                                            } else {
                                                                                                                                                                                                                                                                                                        mergeBtn.disabled = true;
                                                                                                                                                                                                                                                                                                                    fileList.innerHTML = "يرجى اختيار ملفين على الأقل.";
                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                });

                                                                                                                                                                                                                                                                                                                                    mergeBtn.addEventListener('click', async () => {
                                                                                                                                                                                                                                                                                                                                            status.innerText = "جاري المعالجة... يرجى الانتظار";
                                                                                                                                                                                                                                                                                                                                                    status.style.color = "#aaa";
                                                                                                                                                                                                                                                                                                                                                            mergeBtn.disabled = true;

                                                                                                                                                                                                                                                                                                                                                                    try {
                                                                                                                                                                                                                                                                                                                                                                                const { PDFDocument } = PDFLib;
                                                                                                                                                                                                                                                                                                                                                                                            const mergedPdf = await PDFDocument.create();
                                                                                                                                                                                                                                                                                                                                                                                                        const files = fileInput.files;

                                                                                                                                                                                                                                                                                                                                                                                                                    for (const file of files) {
                                                                                                                                                                                                                                                                                                                                                                                                                                    const arrayBuffer = await file.arrayBuffer();
                                                                                                                                                                                                                                                                                                                                                                                                                                                    const pdf = await PDFDocument.load(arrayBuffer);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    copiedPages.forEach((page) => mergedPdf.addPage(page));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const pdfBytes = await mergedPdf.save();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let desiredFileName = fileNameInput.value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!desiredFileName) desiredFileName = 'merged_document';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!desiredFileName.toLowerCase().endsWith('.pdf')) desiredFileName += '.pdf';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const url = URL.createObjectURL(blob);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const a = document.createElement('a');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            a.href = url;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        a.download = desiredFileName;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.body.appendChild(a);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                a.click();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.body.removeChild(a);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        status.innerText = "✅ تم الدمج والتحميل بنجاح!";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    status.style.color = "#28a745";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } catch (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        console.error(error);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    status.innerText = "❌ حدث خطأ أثناء الدمج.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                status.style.color = "#dc3545";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } finally {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    mergeBtn.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
